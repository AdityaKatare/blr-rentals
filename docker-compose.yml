services:
  db:
    image: postgis/postgis:16-3.4
    container_name: blr-rentals-db
    environment:
      POSTGRES_USER: blr
      POSTGRES_PASSWORD: blr
      POSTGRES_DB: blr_rentals
    ports:
      - "5433:5432"
    volumes:
      - blr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blr -d blr_rentals"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  blr_pgdata:
